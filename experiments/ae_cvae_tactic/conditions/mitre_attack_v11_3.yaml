metadata:
  framework: "MITRE Enterprise ATT&CK"
  version: "11.3"
  source: "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack-11.3.json"
  retrieved_at: "2026-06-19"
  note: "Pinned to the release available during the October 2022 dataset period. Normal (TA9000) is intentionally excluded because it is not a MITRE ATT&CK tactic."
tactics:
  "Initial Access (TA0001)":
    label: "Initial Access (TA0001)"
    tactic_id: "TA0001"
    description_full: "The adversary is trying to get into your network. Initial Access consists of techniques that use various entry vectors to gain their initial foothold within a network. Techniques used to gain a foothold include targeted spearphishing and exploiting weaknesses on public-facing web servers. Footholds gained through initial access may allow for continued access, like valid accounts and use of external remote services, or may be limited-use due to changing passwords."
    description_short: "Gain an initial foothold in a target network."
    keywords: ["initial foothold", "spearphishing", "public-facing application", "valid accounts", "remote services"]
  "Execution (TA0002)":
    label: "Execution (TA0002)"
    tactic_id: "TA0002"
    description_full: "The adversary is trying to run malicious code. Execution consists of techniques that result in adversary-controlled code running on a local or remote system. Techniques that run malicious code are often paired with techniques from all other tactics to achieve broader goals, like exploring a network or stealing data. For example, an adversary might use a remote access tool to run a PowerShell script that does Remote System Discovery."
    description_short: "Run adversary-controlled malicious code."
    keywords: ["command", "script", "malicious code", "code execution", "remote execution"]
  "Persistence (TA0003)":
    label: "Persistence (TA0003)"
    tactic_id: "TA0003"
    description_full: "The adversary is trying to maintain their foothold. Persistence consists of techniques that adversaries use to keep access to systems across restarts, changed credentials, and other interruptions that could cut off their access. Techniques used for persistence include any access, action, or configuration changes that let them maintain their foothold on systems, such as replacing or hijacking legitimate code or adding startup code."
    description_short: "Maintain access across restarts and interruptions."
    keywords: ["maintain access", "startup", "account", "configuration change", "foothold"]
  "Defense Evasion (TA0005)":
    label: "Defense Evasion (TA0005)"
    tactic_id: "TA0005"
    description_full: "The adversary is trying to avoid being detected. Defense Evasion consists of techniques that adversaries use to avoid detection throughout their compromise. Techniques used for defense evasion include uninstalling or disabling security software and obfuscating or encrypting data and scripts. Adversaries also leverage and abuse trusted processes to hide and masquerade their malware. Other tactics' techniques are cross-listed here when those techniques include the added benefit of subverting defenses."
    description_short: "Avoid detection and subvert defensive controls."
    keywords: ["avoid detection", "disable security", "obfuscation", "masquerading", "trusted process"]
  "Credential Access (TA0006)":
    label: "Credential Access (TA0006)"
    tactic_id: "TA0006"
    description_full: "The adversary is trying to steal account names and passwords. Credential Access consists of techniques for stealing credentials like account names and passwords. Techniques used to get credentials include keylogging or credential dumping. Using legitimate credentials can give adversaries access to systems, make them harder to detect, and provide the opportunity to create more accounts to help achieve their goals."
    description_short: "Steal account credentials such as names and passwords."
    keywords: ["credentials", "password", "account name", "keylogging", "credential dumping"]
  "Discovery (TA0007)":
    label: "Discovery (TA0007)"
    tactic_id: "TA0007"
    description_full: "The adversary is trying to figure out your environment. Discovery consists of techniques an adversary may use to gain knowledge about the system and internal network. These techniques help adversaries observe the environment and orient themselves before deciding how to act. They also allow adversaries to explore what they can control and what's around their entry point in order to discover how it could benefit their current objective. Native operating system tools are often used toward this post-compromise information-gathering objective."
    description_short: "Learn about systems, networks, and the target environment."
    keywords: ["system information", "network discovery", "environment", "enumeration", "internal network"]
  "Collection (TA0009)":
    label: "Collection (TA0009)"
    tactic_id: "TA0009"
    description_full: "The adversary is trying to gather data of interest to their goal. Collection consists of techniques adversaries may use to gather information and the sources information is collected from that are relevant to following through on the adversary's objectives. Frequently, the next goal after collecting data is to steal or exfiltrate the data. Common target sources include various drive types, browsers, audio, video, and email. Common collection methods include capturing screenshots and keyboard input."
    description_short: "Gather target data relevant to adversary objectives."
    keywords: ["collect data", "screenshots", "keyboard input", "email", "browser data"]
  "Command and Control (TA0011)":
    label: "Command and Control (TA0011)"
    tactic_id: "TA0011"
    description_full: "The adversary is trying to communicate with compromised systems to control them. Command and Control consists of techniques that adversaries may use to communicate with systems under their control within a victim network. Adversaries commonly attempt to mimic normal, expected traffic to avoid detection. There are many ways an adversary can establish command and control with various levels of stealth depending on the victim's network structure and defenses."
    description_short: "Communicate with and control compromised systems."
    keywords: ["command and control", "C2", "compromised system", "communication channel", "network traffic"]
  "Reconnaissance (TA0043)":
    label: "Reconnaissance (TA0043)"
    tactic_id: "TA0043"
    description_full: "The adversary is trying to gather information they can use to plan future operations. Reconnaissance consists of techniques that involve adversaries actively or passively gathering information that can be used to support targeting. Such information may include details of the victim organization, infrastructure, or staff or personnel. This information can be leveraged by the adversary to aid in other phases of the adversary lifecycle, such as using gathered information to plan and execute Initial Access, to scope and prioritize post-compromise objectives, or to drive and lead further Reconnaissance efforts."
    description_short: "Gather information to plan future adversary operations."
    keywords: ["reconnaissance", "targeting", "infrastructure", "organization", "information gathering"]

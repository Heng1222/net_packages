seed: 42
data:
  input_path: "Year=2022/Step1_rawdata_cleaned.csv"
  prepared_dir: "outputs/center_augmented_cvae_step1/smoke/prepared"
  sample_id_col: "Session_ID"
  payload_text_col: "clean_payload_list"
  label_col: "Sess_Tactic_predict"
  time_col: "Datetime"
  payload_parser: "auto"
  read_chunksize: 64
  max_rows: 64
  split: {strategy: "time", train_ratio: 0.7, val_ratio: 0.15, test_ratio: 0.15}
  embedder: {backend: "hashing", output_dim: 32, normalize: true}
conditions:
  path: "experiments/center_augmented_cvae_step1/conditions/mitre_attack_v11_3_step1.yaml"
  cache_dir: "outputs/center_augmented_cvae_step1/smoke/conditions"
  text_fields: ["keywords", "techniques"]
  common_label: "Common Tactic Component"
  embedder: {backend: "hashing", output_dim: 32, normalize: true}
model:
  input_dim: 32
  residual_dim: 8
  encoder_hidden_dims: [32]
  residual_decoder_hidden_dims: [32]
  dropout: 0.0
  batch_norm: false
  activation: "relu"
  gate_temperature: 0.2
loss: {reconstruction: 1.0, kl: 0.01}
training:
  batch_size: 16
  max_epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0
  early_stopping_patience: 2
  num_workers: 0
  device: "cpu"
baselines: {train_plain_vae: true, train_random_condition_cvae: true}
evaluation:
  condition_threshold: 0.5
  golden_path: "Year=2022/Step2_golden_review_2_with_Tactic.csv"
  golden_sample_id_col: "Session_ID"
  golden_label_col: "Tactic"
output: {base_dir: "outputs/center_augmented_cvae_step1/smoke"}

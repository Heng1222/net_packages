metadata:
  framework: "MITRE Enterprise ATT&CK"
  version: "11.3 plus Step1 coverage"
  source: "Existing ae_cvae_tactic condition file extended for Step1 condition coverage."
  note: "Normal (TA9000) is intentionally omitted from tactics and is not a condition."
tactics:
  "Initial Access (TA0001)":
    label: "Initial Access (TA0001)"
    tactic_id: "TA0001"
    description_full: "The adversary is trying to get into your network. Initial Access consists of techniques that use various entry vectors to gain their initial foothold within a network. Techniques used to gain a foothold include targeted spearphishing and exploiting weaknesses on public-facing web servers."
    description_short: "Gain an initial foothold in a target network."
    keywords: ["initial foothold", "spearphishing", "public-facing application", "valid accounts", "remote services"]
  "Execution (TA0002)":
    label: "Execution (TA0002)"
    tactic_id: "TA0002"
    description_full: "The adversary is trying to run malicious code. Execution consists of techniques that result in adversary-controlled code running on a local or remote system."
    description_short: "Run adversary-controlled malicious code."
    keywords: ["command", "script", "malicious code", "code execution", "remote execution"]
  "Persistence (TA0003)":
    label: "Persistence (TA0003)"
    tactic_id: "TA0003"
    description_full: "The adversary is trying to maintain their foothold. Persistence consists of techniques that adversaries use to keep access to systems across restarts, changed credentials, and other interruptions."
    description_short: "Maintain access across restarts and interruptions."
    keywords: ["maintain access", "startup", "account", "configuration change", "foothold"]
  "Privilege Escalation (TA0004)":
    label: "Privilege Escalation (TA0004)"
    tactic_id: "TA0004"
    description_full: "The adversary is trying to gain higher-level permissions. Privilege Escalation consists of techniques that adversaries use to obtain elevated access, such as administrator, root, or system permissions, after gaining initial access."
    description_short: "Gain higher-level permissions on a system."
    keywords: ["privilege escalation", "administrator", "root", "elevated access", "permissions"]
  "Defense Evasion (TA0005)":
    label: "Defense Evasion (TA0005)"
    tactic_id: "TA0005"
    description_full: "The adversary is trying to avoid being detected. Defense Evasion consists of techniques that adversaries use to avoid detection throughout their compromise."
    description_short: "Avoid detection and subvert defensive controls."
    keywords: ["avoid detection", "disable security", "obfuscation", "masquerading", "trusted process"]
  "Credential Access (TA0006)":
    label: "Credential Access (TA0006)"
    tactic_id: "TA0006"
    description_full: "The adversary is trying to steal account names and passwords. Credential Access consists of techniques for stealing credentials like account names and passwords."
    description_short: "Steal account credentials such as names and passwords."
    keywords: ["credentials", "password", "account name", "keylogging", "credential dumping"]
  "Discovery (TA0007)":
    label: "Discovery (TA0007)"
    tactic_id: "TA0007"
    description_full: "The adversary is trying to figure out your environment. Discovery consists of techniques an adversary may use to gain knowledge about the system and internal network."
    description_short: "Learn about systems, networks, and the target environment."
    keywords: ["system information", "network discovery", "environment", "enumeration", "internal network"]
  "Lateral Movement (TA0008)":
    label: "Lateral Movement (TA0008)"
    tactic_id: "TA0008"
    description_full: "The adversary is trying to move through your environment. Lateral Movement consists of techniques that adversaries use to enter and control remote systems on a network."
    description_short: "Move through the environment to control remote systems."
    keywords: ["lateral movement", "remote system", "internal movement", "remote service", "pivot"]
  "Collection (TA0009)":
    label: "Collection (TA0009)"
    tactic_id: "TA0009"
    description_full: "The adversary is trying to gather data of interest to their goal. Collection consists of techniques adversaries may use to gather information and the sources information is collected from."
    description_short: "Gather target data relevant to adversary objectives."
    keywords: ["collect data", "screenshots", "keyboard input", "email", "browser data"]
  "Exfiltration (TA0010)":
    label: "Exfiltration (TA0010)"
    tactic_id: "TA0010"
    description_full: "The adversary is trying to steal data. Exfiltration consists of techniques that adversaries may use to remove data from a network, often packaging, compressing, encrypting, or transferring it over command and control channels."
    description_short: "Remove or steal data from a target environment."
    keywords: ["exfiltration", "steal data", "transfer data", "compress", "encrypt"]
  "Command and Control (TA0011)":
    label: "Command and Control (TA0011)"
    tactic_id: "TA0011"
    description_full: "The adversary is trying to communicate with compromised systems to control them. Command and Control consists of techniques that adversaries may use to communicate with systems under their control."
    description_short: "Communicate with and control compromised systems."
    keywords: ["command and control", "C2", "compromised system", "communication channel", "network traffic"]
  "Resource Development (TA0042)":
    label: "Resource Development (TA0042)"
    tactic_id: "TA0042"
    description_full: "The adversary is trying to establish resources they can use to support operations. Resource Development consists of techniques that involve creating, purchasing, compromising, or otherwise obtaining infrastructure, accounts, capabilities, or other resources."
    description_short: "Establish resources used to support adversary operations."
    keywords: ["resource development", "infrastructure", "accounts", "capabilities", "operations"]
  "Reconnaissance (TA0043)":
    label: "Reconnaissance (TA0043)"
    tactic_id: "TA0043"
    description_full: "The adversary is trying to gather information they can use to plan future operations. Reconnaissance consists of techniques that involve adversaries actively or passively gathering information that can be used to support targeting."
    description_short: "Gather information to plan future adversary operations."
    keywords: ["reconnaissance", "targeting", "infrastructure", "organization", "information gathering"]

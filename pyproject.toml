[project]
name = "network-payload-cvae-experiments"
version = "0.1.0"
description = "Network payload AE/CVAE experiment pipelines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "joblib==1.5.3",
    "PyYAML==6.0.3",
    "matplotlib==3.10.9",
    "torch==2.12.0",
    "transformers==5.10.2",
    "sentence-transformers==5.6.0",
    "tqdm==4.68.2",
    "umap-learn==0.5.12",
    "zstandard>=0.23",
    "gdown>=6.1.0",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=16",
]
notebook = [
    "ipykernel>=6",
    "jupyterlab>=4",
]

[tool.uv]
package = false
